- name: Enable WireGuard in Kernel Build
  shell: bash
  run: |
    set -euo pipefail

    grep -q '^source "net/wireguard/Kconfig"$' net/Kconfig || \
      sed -i '/^if INET$/a\source "net/wireguard/Kconfig"' net/Kconfig

    grep -q '^obj-$(CONFIG_WIREGUARD).*wireguard/' net/Makefile || \
      sed -i '/^obj-$(CONFIG_NETFILTER)/a obj-$(CONFIG_WIREGUARD) += wireguard/' net/Makefile

    for config in arch/arm64/configs/begonia_apatch_defconfig arch/arm64/configs/begonia_user_defconfig; do
      grep -q '^CONFIG_WIREGUARD=' "$config" || \
        echo 'CONFIG_WIREGUARD=y' >> "$config"
    done

    grep -n 'WIREGUARD\|wireguard' \
      net/Kconfig \
      net/Makefile \
      arch/arm64/configs/begonia_*_defconfig